aid: careguide
name: CareGuide
description: >-
  CareGuide is a Canadian company operating a network of online marketplaces that connect families
  with caregivers across child care, home care, pet care, and elder care, alongside HeartPayroll
  household payroll services. Its consumer brands include CanadianNanny.ca, Sitter.com, PetSitter.com,
  ElderCare.com, HouseKeeper.com and a family of "Meet A" professional directories. Backed by 500
  Global, CareGuide is added to the API Evangelist network as a company profile. The company does not
  publish a public developer portal, API documentation, SDKs, or machine-readable API specifications;
  this profile captures its public web identity and domain-security posture.
